apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  description: Applications for Dev
  sourceNamespaces:
    - '*'
  sourceRepos:
  - '*'
  destinations:
  - namespace: 'dev'
    name: in-cluster
    
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
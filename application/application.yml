apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MyoMinS/argo-labs-example.git
    targetRevision: main
    path: staging

  destination:
    name: in-cluster
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

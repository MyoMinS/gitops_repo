apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MyoMinS/gitops_repo.git
    targetRevision: main
    path: mainfests/overlays/dev

  destination:
    name: in-cluster
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

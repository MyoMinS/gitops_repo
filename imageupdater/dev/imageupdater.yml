apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: my-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "vote-*"
      images:
        - alias: "vote"
          imageName: "484907514740.dkr.ecr.ap-southeast-1.amazonaws.com/vote:prod"
          commonUpdateSettings:
            updateStrategy: "digest"
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: aws-secret-controller
---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-external-secret
spec:
  refreshInterval: 1h 
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: my-k8s-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/nginx

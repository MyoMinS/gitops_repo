---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-external-secret
  namespace: prod
spec:
  refreshInterval: 1h 
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: my-k8s-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/nginx